services:
  postgres:
    image: postgres:alpine
    container_name: procul_chat_postgres_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: procul_chat
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
name: Publish backend image

# Publishing is tag-driven only: a `v*` tag produces the image. Ordinary commits
# are validated by the CI workflow instead.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    name: Build & test backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: backend/**/*.csproj
          check-latest: false

      - name: Restore
        run: dotnet restore backend/Procul.slnx

      - name: Test
        run: dotnet test backend/Procul.slnx --configuration Release --no-restore --verbosity normal

  publish:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ghcr.io/<owner>/<repo>/backend-api, lowercased because registry names must be lowercase.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/backend-api" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          # Adds `latest` for stable (non-prerelease) version tags.
          flavor: latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/src/Procul.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse the Docker layer cache across runs via the Actions cache API.
          cache-from: type=gha
          cache-to: type=gha,mode=max

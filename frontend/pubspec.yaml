name: procul_chat_flutter
description: "Procul — a Flutter chat client for the Procul backend."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  shadcn_flutter: ^0.0.55
  gpt_markdown: ^1.3.4
  shadcn_flutter_material: ^0.0.54
  google_fonts: ^9.0.0
  fl_chart: ^1.2.0
  file_picker: ^13.1.0
  http_parser: ^4.1.0
  image_picker: ^1.2.4
  image_picker_platform_interface: ^2.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App icon generation. Drop a 1024×1024 PNG at assets/icon/icon.png and
# run `dart run flutter_launcher_icons` to (re)generate every platform target.
# See docs/flutter-builds.md for where each target's files land.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  # The source has a transparent background; flatten it (App Store rejects alpha).
  # The mark's strokes are black, so the white default keeps the glyph visible.
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  macos:
    generate: true
    image_path: assets/icon/icon.png
  windows:
    generate: true
    image_path: assets/icon/icon.png
    # The tool writes a single-frame .ico (default 48 px); 256 downsizes cleanly.
    icon_size: 256
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#09090B"
    theme_color: "#a832a0"
  # Android adaptive icon: a magenta background with the source as foreground.
  adaptive_icon_background: "#a832a0"
  adaptive_icon_foreground: assets/icon/icon.png

flutter:
  uses-material-design: true
